name: Deliver Cosmic Aquaria

on:
  workflow_dispatch:
    inputs:
      artist_title:
        description: Artist name
        required: true
        type: string
      page_url:
        description: Published Cosmic Aquaria URL
        required: true
        type: string
      qr_url:
        description: Published scan-verified QR PNG URL
        required: true
        type: string
      recipient_email:
        description: Delivery recipient
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cosmic-aquarium-delivery-${{ inputs.page_url }}
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Send Cosmic Aquaria link and QR
        env:
          ARTIST_TITLE: ${{ inputs.artist_title }}
          PAGE_URL: ${{ inputs.page_url }}
          QR_URL: ${{ inputs.qr_url }}
          RECIPIENT_EMAIL: ${{ inputs.recipient_email }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_FROM_EMAIL: ${{ secrets.REPORT_FROM_EMAIL }}
        run: |
          node --input-type=module <<'NODE'
          import process from "node:process";
          const required = ["ARTIST_TITLE","PAGE_URL","QR_URL","RECIPIENT_EMAIL","RESEND_API_KEY","REPORT_FROM_EMAIL"];
          for (const name of required) if (!process.env[name]) throw new Error(name + " is required.");
          const allowed = "https://raggedya.github.io/cosmic-aquarium/";
          if (!process.env.PAGE_URL.startsWith(allowed) || !process.env.QR_URL.startsWith(allowed)) {
            throw new Error("Delivery URLs must belong to the published Cosmic Aquaria GitHub Pages site.");
          }
          if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(process.env.RECIPIENT_EMAIL)) {
            throw new Error("Recipient email is invalid.");
          }
          const qrResponse = await fetch(process.env.QR_URL, {redirect:"follow"});
          if (!qrResponse.ok || !(qrResponse.headers.get("content-type") || "").toLowerCase().includes("image/png")) {
            throw new Error("Published QR PNG is unavailable.");
          }
          const qrContent = Buffer.from(await qrResponse.arrayBuffer()).toString("base64");
          const escape = value => String(value).replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
          const filename = process.env.ARTIST_TITLE.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") + "-cosmic-aquaria-qr.png";
          const response = await fetch("https://api.resend.com/emails", {
            method:"POST",
            headers:{
              authorization:"Bearer " + process.env.RESEND_API_KEY,
              "content-type":"application/json",
              "idempotency-key":"cosmic-aquarium-" + process.env.GITHUB_RUN_ID + "-" + process.env.GITHUB_RUN_ATTEMPT
            },
            body:JSON.stringify({
              from:process.env.REPORT_FROM_EMAIL,
              to:[process.env.RECIPIENT_EMAIL],
              subject:"Cosmic Aquaria is ready - " + process.env.ARTIST_TITLE,
              html:`<div style="background:#07071d;color:#f7f5ff;padding:42px;font-family:Arial,sans-serif"><p style="letter-spacing:.22em;color:#c8b9f3;font-size:12px">COSMIC AQUARIA</p><h1 style="font-weight:400">${escape(process.env.ARTIST_TITLE)}</h1><p>Your living Bandcamp discovery page and scan-tested floral QR are ready.</p><p><a style="color:#d5c8ff" href="${escape(process.env.PAGE_URL)}">Open this Aquaria world</a></p><p style="color:#aaa3c4;font-size:12px">Listening and support remain on Bandcamp.</p></div>`,
              attachments:[{filename,content:qrContent}],
              tags:[{name:"product",value:"cosmic_aquaria"}]
            })
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error("Resend delivery failed: " + JSON.stringify(result));
          console.log(JSON.stringify({ok:true,email_id:result.id,page_url:process.env.PAGE_URL}));
          NODE
