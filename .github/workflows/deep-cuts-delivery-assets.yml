name: Deep Cuts delivery assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the permanent platform
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and verify image dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -c "import PIL, qrcode, zxingcpp; print('Deep Cuts image dependencies verified.')"
      - name: Validate every completed product
        run: npm run validate
      - name: Restore unchanged scan-tested artwork
        id: artwork_cache
        uses: actions/cache@v4
        with:
          path: output
          key: deep-cuts-artwork-v1-${{ runner.os }}-${{ hashFiles('platform.json', 'editions/**', 'assets/**', 'scripts/build-delivery-assets.mjs', 'scripts/generate-social-assets.py', 'scripts/verify-delivery-assets.py', 'scripts/qr-matrix.cjs', 'scripts/vendor/qrcode.min.js', 'requirements.txt') }}
      - name: Generate and verify every active edition
        if: steps.artwork_cache.outputs.cache-hit != 'true'
        run: node scripts/build-delivery-assets.mjs --validated --dependencies-ready --jobs 2 --profile .deep-cuts/artwork-profile.json
      - name: Re-verify restored delivery artwork
        if: steps.artwork_cache.outputs.cache-hit == 'true'
        run: python scripts/verify-delivery-assets.py
      - name: Upload delivery package
        uses: actions/upload-artifact@v4
        with:
          name: deep-cuts-delivery-assets
          path: output/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
