name: Deep Cuts validation

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: npm run validate
      - name: Verify Record Company delivery production
        run: python scripts/test-record-company-deliverables.py
      - run: python scripts/generate-social-assets.py
      - name: Verify the generated default-edition artwork
        shell: bash
        run: |
          slug="$(node -p "require('./platform.json').defaultEdition")"
          python scripts/verify-delivery-assets.py --slug "$slug"
